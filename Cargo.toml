[package]
name = "vynglish"
version = "0.1.0"
edition = "2024"

[lib]
name = "vynglish"
path = "src/lib.rs"

[[bin]]
name = "vyn"
path = "src/main.rs"

[dependencies]
rustyline = "13"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
dirs = "5.0"
colored = "2"
thiserror = "1.0"
ctrlc = "3"
rand = "0.10.3"

[build-dependencies]
chrono = "0.4.45"
vergen = "10.0.3"

[dev-dependencies]
iced-x86 = "1.21"
